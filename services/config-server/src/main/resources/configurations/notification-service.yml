spring:
  data:
    mongodb:
      username: rbattezzati
      password: rbattezzati
      host: localhost
      port: 27017
      database: notification
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup, orderGroup
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: 'com.rbattezzati.ecommerce.*'
        spring.json.type.mapping: orderConfirmation:com.rbattezzati.ecommerce.kafka.OrderConfirmation,paymentConfirmation:com.rbattezzati.ecommerce.notification.PaymentNotificationRequest

  mail:
    host: localhost
    port: 1025
    username: rbattezzati
    password: rbattezzati
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

server:
  port: 8040
